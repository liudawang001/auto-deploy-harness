name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked private docs and credential files
        run: |
          test -z "$(git ls-files docs .env '*.pem' '*.key')"
      - name: Scan tracked files for common live-secret shapes
        run: |
          ! git grep -nE '(sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)'

  tests:
    # A direct push may opt out of the expensive compatibility matrix only.
    # Pull requests always run the matrix, even when their commit message has the marker.
    if: >-
      ${{
        github.event_name != 'push' ||
        !contains(github.event.head_commit.message, '[skip-python-matrix]')
      }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: pytest -q

  development-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Run offline default CLI smoke
        run: >-
          python -m auto_harness.cli deploy
          --repo tests/fixtures/e2e/http_trace_echo
          --name ci-development-smoke
          --dry-run
          --agent-provider mock
          --agent-plan-first-provider mock

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: pip-audit
