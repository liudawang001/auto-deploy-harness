name: Release Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m auto_harness.release_gates
      - run: python -m auto_harness.cli readiness --output reports/readiness-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: reports/*.json
