[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-auto-harness"
version = "0.1.0"
description = "A Python-controlled agent harness for deploying and verifying AI demo projects."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "liudawang001" }
]
dependencies = []

[project.scripts]
auto-harness = "auto_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

