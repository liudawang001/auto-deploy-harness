[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-deploy-harness"
version = "0.1.0"
description = "A Python-controlled agent harness for deploying and verifying AI demo projects."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "liudawang001" }
]
dependencies = [
  "langgraph",
  "langgraph-checkpoint-sqlite",
]

[project.optional-dependencies]
langgraph = []  # Now in core deps; kept as empty compat group

[project.scripts]
auto-deploy-harness = "auto_harness.cli:main"
auto-harness = "auto_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
